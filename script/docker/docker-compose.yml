name: yudao-system

services:
  mysql:
    container_name: yudao-mysql
    image: mysql:8.0.45
    restart: unless-stopped
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql:/var/lib/mysql
      - ../../sql/mysql/ruoyi-vue-pro.sql:/docker-entrypoint-initdb.d/ruoyi-vue-pro.sql:ro
    networks: [yudao]

  redis:
    container_name: yudao-redis
    image: redis:6.2-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - redis:/data
    networks: [yudao]

  server:
    container_name: yudao-server
    image: eclipse-temurin:17-jre
    restart: unless-stopped
    working_dir: /app
    command: ["sh", "-c", "exec java $${JAVA_OPTS} -jar /app/yudao-server.jar $${ARGS}"]
    environment:
      SPRING_PROFILES_ACTIVE: prod
      JAVA_OPTS: ${JAVA_OPTS}
      ARGS: ${ARGS}
      MASTER_DATASOURCE_URL: ${MASTER_DATASOURCE_URL}
      MASTER_DATASOURCE_USERNAME: ${MASTER_DATASOURCE_USERNAME}
      MASTER_DATASOURCE_PASSWORD: ${MASTER_DATASOURCE_PASSWORD}
      SLAVE_DATASOURCE_URL: ${SLAVE_DATASOURCE_URL}
      SLAVE_DATASOURCE_USERNAME: ${SLAVE_DATASOURCE_USERNAME}
      SLAVE_DATASOURCE_PASSWORD: ${SLAVE_DATASOURCE_PASSWORD}
      REDIS_HOST: yudao-redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - ../../yudao-server/target/yudao-server.jar:/app/yudao-server.jar:ro
      - app_logs:/root/logs
      - app_uploads:/app/uploads
    depends_on:
      mysql:
        condition: service_started
      redis:
        condition: service_started
    networks: [yudao]

  nginx:
    container_name: yudao-nginx
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ../../yudao-ui/yudao-ui-admin-vue3/dist-prod:/usr/share/nginx/html:ro
      - ../../marketing-site:/usr/share/nginx/marketing:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - server
    networks: [yudao]

volumes:
  mysql:
  redis:
  app_logs:
  app_uploads:

networks:
  yudao:
    driver: bridge
