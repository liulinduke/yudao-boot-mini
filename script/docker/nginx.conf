server {
    listen 80 default_server;
    server_name eyoch.com www.eyoch.com;

    root /usr/share/nginx/marketing;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 80;
    server_name api.eyoch.com;

    client_max_body_size 32m;

    location /admin-api/ {
        proxy_pass http://yudao-server:48080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /infra/ws {
        proxy_pass http://yudao-server:48080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
    }
}

server {
    listen 80;
    server_name admin.eyoch.com 1.14.181.156;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 32m;

    location /admin-api/ {
        proxy_pass http://yudao-server:48080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /infra/ws {
        proxy_pass http://yudao-server:48080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
    }

    location /downloads/ {
        alias /usr/share/nginx/marketing/downloads/;
        autoindex off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
